[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chartduck-mcp"
version = "0.1.0"
description = "MCP server and CLI for ChartDuck chart data extraction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "mcp>=1.10,<3",
]

[project.scripts]
chartduck-mcp = "mcp_server:main"
chartduck = "cli:main"

[tool.setuptools]
py-modules = ["chartduck_client", "mcp_server", "cli"]
