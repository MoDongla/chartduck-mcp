[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chartduck-mcp"
version = "0.1.1"
description = "MCP server and CLI for ChartDuck chart data extraction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ChartDuck"}]
keywords = ["mcp", "model-context-protocol", "chart", "ocr", "pdf", "data-extraction"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "mcp>=1.10,<3",
]

[project.urls]
Homepage = "https://chartduck.com"
Repository = "https://github.com/MoDongla/chartduck-mcp"
Issues = "https://github.com/MoDongla/chartduck-mcp/issues"

[project.scripts]
chartduck-mcp = "mcp_server:main"
chartduck = "cli:main"

[tool.setuptools]
py-modules = ["chartduck_client", "mcp_server", "cli"]
